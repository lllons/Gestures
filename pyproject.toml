[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gestures-nose-touch"
version = "1.0.0"
description = "Local Windows webcam nose-touch keyboard shortcut controller"
requires-python = ">=3.10,<3.13"
dependencies = [
    "mediapipe>=0.10.30,<1.1",
    "opencv-contrib-python>=4.10,<5",
    "numpy>=1.26,<3",
    "Pillow>=10,<13",
    "pynput>=1.7.7,<2",
]

[project.scripts]
gestures = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*"]
